  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {

    font-family: Arial Black, Arial, sans-serif;
    background: #585dfe;

  .sign {
    width: 3200px;
    height: 2400px;
    background: #585dfe;
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  /* LEFT TEXT SIDE */
  .left {
    flex: 1.6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 130px 120px 130px 160px;
    gap: 0;
  }
  .wordmark {
    font-size: 120px;
    font-weight: 900;
    color: #bfeff2;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 40px;
    text-transform: lowercase;
  }
  .headline {
    font-size: 280px;
    font-weight: 900;
    color: #ffffff;
    line-height: 0.92;
    letter-spacing: -8px;
    margin-bottom: 60px;
  }
  .sub {
    font-size: 90px;
    font-weight: 700;
    color: rgba(255,255,255,0.88);
    line-height: 1.2;
  }
  .free-badge {
    display: inline-block;
    background: #bfeff2;
    color: #0f0f16;
    font-size: 68px;
    font-weight: 900;
    padding: 22px 60px;
    border-radius: 100px;
    margin-top: 70px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  /* RIGHT QR SIDE */
  .right {
    flex: 1;
    background: #f7f8fc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 70px;
    gap: 50px;
  }
  .scan-text {
    font-size: 72px;
    font-weight: 900;
    color: #585dfe;
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 1.15;
  }
  .qr-box {
    background: #ffffff;
    border-radius: 30px;
    padding: 40px;
    box-shadow: 0 0 0 8px #585dfe;
  }
  .qr-box img {
    width: 860px;
    height: 860px;
    display: block;
  }
  .url-text {
    font-size: 34px;
    font-weight: 700;
    color: #888;
    text-align: center;
    word-break: break-all;
    line-height: 1.4;
  }
</style>
